# Lance l'API et l'interface de supervision ensemble — usage local ET
# cible reelle de deploiement (voir .github/workflows/ci.yml, job
# "deploiement", deploiement reel effectue manuellement avec succes,
# voir README).
#
# Ce meme fichier tourne aussi tel quel sur l'instance Compute Scaleway
# de production (cloud souverain europeen, pas de Kubernetes ni de
# registre de conteneurs — 2 conteneurs sur une seule petite instance
# ne justifient pas cette complexite/ce cout). Cette instance est
# partagee avec Kafka et ClickHouse auto-heberges du Bloc 3 (memes
# raisons de cout) — voir le README du Bloc 2 pour la justification
# complete de ces choix d'infrastructure.
services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    environment:
      - API_KEY=${API_KEY:-cle-demo-locale}
      - TICKETS_PERSISTANCE_PATH=/data/tickets.json
    volumes:
      # Historique des tickets GMAO persiste entre deux redemarrages du
      # conteneur (voir app/main.py, CHEMIN_PERSISTANCE) — un volume
      # nomme, pas un bind mount, pour rester portable entre poste local
      # et instance de production.
      - tickets-gmao:/data

  ui:
    build:
      context: .
      dockerfile: ui/Dockerfile
    ports:
      - "8501:8501"
    environment:
      - API_URL=http://api:8000
      - API_KEY=${API_KEY:-cle-demo-locale}
    depends_on:
      - api

volumes:
  tickets-gmao:
